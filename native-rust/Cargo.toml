[package]
name = "native-rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
getrandom = "0.4"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
ml-dsa = { version = "0.1.1", features = ["getrandom"] }

thiserror = "2"
zeroize = "1.9"

windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography"
] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
hkdf = "0.12.4"
sha3 = "0.10.8"
