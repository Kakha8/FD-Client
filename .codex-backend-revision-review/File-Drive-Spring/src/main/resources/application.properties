spring.application.name=File-Drive-Spring

# H2 in-memory database
spring.datasource.url=jdbc:h2:file:./data/mydb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Revision history is a deliberate development-schema reset; production needs a managed migration.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.h2.console.settings.web-allow-others=true

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MinIO / S3 ---
s3.endpoint=${S3_ENDPOINT}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
#s3.bucket=${S3_BUCKET}
s3.quarantine-bucket=${S3_QUARANTINE_BUCKET:file-drive-quarantine}
s3.trash-bucket=${S3_TRASH_BUCKET:file-drive-trash}


# Basic MinIO object encryption without KMS
s3.encryption.ssec.enabled=${S3_SSEC_ENABLED:true}
s3.encryption.keystore.path=${S3_SSEC_KEYSTORE_PATH:./keys/minio-sse-c.jceks}
s3.encryption.keystore.alias=${S3_SSEC_KEY_ALIAS:minio-sse-c-key}
s3.encryption.keystore.password=${S3_SSEC_KEYSTORE_PASSWORD:changeit-keystore}
s3.encryption.key.password=${S3_SSEC_KEY_PASSWORD:changeit-key}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expires-minutes=${JWT_EXPIRES_MINUTES:15}

spring.servlet.multipart.max-file-size=100GB
spring.servlet.multipart.max-request-size=100GB

lockbox.upload.max-container-size=${LOCKBOX_MAX_CONTAINER_SIZE:107374182400}
lockbox.upload.max-manifest-size=${LOCKBOX_MAX_MANIFEST_SIZE:264}
lockbox.upload.max-signature-size=${LOCKBOX_MAX_SIGNATURE_SIZE:4675}

clamav.host=${CLAMAV_HOST:clamav}
clamav.port=${CLAMAV_PORT:3310}
clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:120000}

# --- Server ---
server.port=8443
server.ssl.enabled=true

server.ssl.key-store=/certs/app/server-keystore.p12
server.ssl.key-store-password=${TLS_PASSWORD}
server.ssl.key-store-type=PKCS12

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

#Async timeout
spring.mvc.async.request-timeout=12h
