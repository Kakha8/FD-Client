[package]
name = "fd-virtual-drive"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winfsp = { version = "0.13.1", default-features = false, features = ["delayload"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }

[build-dependencies]
winfsp = { version = "0.13.1", default-features = false, features = ["delayload"] }
